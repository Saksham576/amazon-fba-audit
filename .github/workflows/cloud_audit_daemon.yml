name: Cloud Audit Daemon (24/7 Autonomous FBA Engine)

on:
  schedule:
    # Executes daily at 09:00 UTC (runs 24/7 in GitHub cloud even when local PC is powered down)
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      simulate_if_empty:
        description: 'Fallback to simulated fixtures if inbound_reports/ is empty'
        required: true
        type: boolean
        default: true
      seller_id:
        description: 'Target Seller Central Merchant ID'
        required: false
        type: string
        default: 'SELLER_CLOUD_SCHEDULED'

permissions:
  contents: read
  actions: write

jobs:
  cloud_audit_cycle:
    name: Execute Autonomous Audit & Payout Alert
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FBA Audit Engine
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run Autonomous Audit Daemon
        env:
          FBA_OWNER_EMAIL: virajtiwari52@gmail.com
          FBA_SENDER_EMAIL: ${{ secrets.FBA_SENDER_EMAIL || 'team@nexuspulsetech.com' }}
          FBA_SMTP_HOST: ${{ secrets.FBA_SMTP_HOST }}
          FBA_SMTP_PORT: ${{ secrets.FBA_SMTP_PORT || '587' }}
          FBA_SMTP_USER: ${{ secrets.FBA_SMTP_USER }}
          FBA_SMTP_PASS: ${{ secrets.FBA_SMTP_PASS }}
          INPUT_SELLER_ID: ${{ inputs.seller_id }}
          INPUT_SIMULATE: ${{ inputs.simulate_if_empty }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p inbound_reports audit_output payouts/notifications
          SELLER_ARG="${INPUT_SELLER_ID:-SELLER_CLOUD_SCHEDULED}"
          SIM_FLAG=""
          if [ "$EVENT_NAME" = "schedule" ] || [ "$INPUT_SIMULATE" = "true" ] || [ -z "$EVENT_NAME" ]; then
            SIM_FLAG="--simulate-if-empty"
          fi
          fba-daemon --once $SIM_FLAG --seller "$SELLER_ARG"

      - name: Upload Audit Deliverables (CSV, HTML Dossier, JSON)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-deliverables-${{ github.run_id }}
          path: audit_output/
          if-no-files-found: warn

      - name: Upload Payout Ledger & Notifications
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payout-deliverables-${{ github.run_id }}
          path: payouts/
          if-no-files-found: warn

      - name: Dispatch Payout Alert & Output Step Summary
        if: always()
        run: |
          python -c "
          import json, glob, os
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          notifications = sorted(glob.glob('payouts/notifications/*.json'))
          ledger_path = 'payouts/payout_ledger.json'
          
          lines = []
          lines.append('## 💰 Cloud Autonomous FBA Audit & Payout Report')
          lines.append('**Beneficiary Owner:** `virajtiwari52@gmail.com`')
          lines.append('**Governing Policies:** Amazon Help Hub G200379860, G200213130, G21213\n')
          
          if os.path.exists(ledger_path):
              with open(ledger_path, 'r', encoding='utf-8') as f:
                  ld = json.load(f)
              lines.append('### Payout Ledger Status')
              lines.append(f'- **Total Recoverable Identified:** ${ld.get(\"total_recoverable_usd\", 0.0):,.2f}')
              lines.append(f'- **Total Contingency Fees (15%):** ${ld.get(\"total_earned_usd\", 0.0):,.2f}')
              lines.append(f'- **Total Audited Cycles:** {len(ld.get(\"audit_runs\", []))}')
              lines.append(f'- **Unique Claim Hashes Processed:** {len(ld.get(\"processed_claim_hashes\", []))}\n')
          
          if notifications:
              latest = notifications[-1]
              with open(latest, 'r', encoding='utf-8') as f:
                  nd = json.load(f)
              lines.append('### Latest Payout Notification Alert')
              lines.append(f'- **Recipient:** `{nd.get(\"recipient\", \"virajtiwari52@gmail.com\")}`')
              lines.append(f'- **Actionable Claims:** {nd.get(\"total_claims\", 0)}')
              lines.append(f'- **Net Payout Fee:** ${nd.get(\"payout_cut\", 0.0):,.2f}')
              lines.append(f'- **SMTP Delivery:** {\"Transmitted via Live SMTP\" if nd.get(\"smtp_sent\") else \"Recorded to .eml file in artifacts\"}')
              lines.append(f'- **EML File Record:** `{nd.get(\"eml_path\", \"N/A\")}`')
          else:
              lines.append('*(No new unnotified claims generated in this cycle)*')
              
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as f:
                  f.write('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          "
