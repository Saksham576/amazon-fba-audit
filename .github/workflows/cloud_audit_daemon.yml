name: Cloud Audit Daemon (24/7 Autonomous FBA Engine)

on:
  schedule:
    # Executes daily at 09:00 UTC (runs 24/7 in GitHub cloud even when local PC is powered down)
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      simulate_if_empty:
        description: 'Fallback to simulated fixtures if inbound_reports/ is empty'
        required: true
        type: boolean
        default: true
      seller_id:
        description: 'Target Seller Central Merchant ID'
        required: false
        type: string
        default: 'SELLER_CLOUD_SCHEDULED'

permissions:
  contents: write
  actions: write

jobs:
  cloud_audit_cycle:
    name: Execute Autonomous Business & Outreach Cycle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FBA Audit & Acquisition Suite
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run Autonomous Business Cycle (Outreach + Audit + Payouts)
        env:
          FBA_OWNER_EMAIL: virajtiwari52@gmail.com
          FBA_SENDER_EMAIL: ${{ secrets.FBA_SENDER_EMAIL || 'team@nexuspulsetech.com' }}
          FBA_SMTP_HOST: ${{ secrets.FBA_SMTP_HOST }}
          FBA_SMTP_PORT: ${{ secrets.FBA_SMTP_PORT || '587' }}
          FBA_SMTP_USER: ${{ secrets.FBA_SMTP_USER }}
          FBA_SMTP_PASS: ${{ secrets.FBA_SMTP_PASS }}
          INPUT_SELLER_ID: ${{ inputs.seller_id }}
          INPUT_SIMULATE: ${{ inputs.simulate_if_empty }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p inbound_reports audit_output payouts/notifications payouts/crm/outbox
          SELLER_ARG="${INPUT_SELLER_ID:-SELLER_CLOUD_SCHEDULED}"
          SIM_FLAG="--simulate-audit"
          if [ "$INPUT_SIMULATE" = "false" ]; then
            SIM_FLAG=""
          fi
          fba-business --batch-size 5 $SIM_FLAG --seller "$SELLER_ARG"

      - name: Upload Audit Deliverables (CSV, HTML Dossier, JSON)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-deliverables-${{ github.run_id }}
          path: audit_output/
          if-no-files-found: warn

      - name: Upload Payout Ledger & CRM State
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: business-state-${{ github.run_id }}
          path: payouts/
          if-no-files-found: warn

      - name: Persist CRM State & Payout Ledger
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add payouts/crm/crm_state.json payouts/payout_ledger.json payouts/last_cycle_summary.md || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(autonomous): update CRM pipeline state and payout ledger [skip ci]"
            git push origin main || echo "Push skipped or rejected."
          else
            echo "No state changes to commit."
          fi

